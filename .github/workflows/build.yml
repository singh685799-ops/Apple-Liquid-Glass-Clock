name: Build AppleLiquidGlassClock APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Normalize Project Structure & Clean Placeholder Files
        run: |
          rm -f assets/fonts/nofiles.txt nofiles.txt
          mkdir -p assets/fonts assets/xml res/values res/drawable dist

          # Ensure AndroidManifest.xml is in root and properly structured
          cat << 'EOF' > AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"
              package="com.monotype.android.font.appleliquidglass"
              android:versionCode="1"
              android:versionName="1.0">
              <uses-sdk android:minSdkVersion="24" android:targetSdkVersion="33" />
              <application
                  android:allowBackup="false"
                  android:hasCode="false"
                  android:icon="@drawable/ic_launcher"
                  android:label="@string/app_name">
                  <meta-data
                      android:name="com.monotype.android.font.name"
                      android:value="AppleLiquidGlassClock" />
              </application>
          </manifest>
          EOF

          # Ensure strings.xml is in res/values/
          cat << 'EOF' > res/values/strings.xml
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="app_name">AppleLiquidGlassClock</string>
              <string name="font_name">AppleLiquidGlassClock</string>
          </resources>
          EOF

          # Ensure ic_launcher.xml is in res/drawable/
          cat << 'EOF' > res/drawable/ic_launcher.xml
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
              <path android:fillColor="#0A192F" android:pathData="M0,0h108v108h-108z" />
              <path android:fillColor="#E6F1FF" android:pathData="M54,18 A36,36 0 1,0 54,90 A36,36 0 1,0 54,18 Z M54,25 A29,29 0 1,1 54,83 A29,29 0 1,1 54,25 Z M51,34 h6 v22 h15 v6 h-21 Z" />
          </vector>
          EOF

          # Ensure AppleLiquidGlassClock.xml is in assets/xml/
          cat << 'EOF' > assets/xml/AppleLiquidGlassClock.xml
          <?xml version="1.0" encoding="utf-8"?>
          <font displayname="AppleLiquidGlassClock">
              <sans>
                  <file>
                      <filename>AppleLiquidGlassClock.ttf</filename>
                      <droidname>DroidSans.ttf</droidname>
                  </file>
              </sans>
          </font>
          EOF

      - name: Install Font Dependencies & Generate TTF
        run: |
          python -m pip install --upgrade pip
          pip install fonttools shapely
          if [ ! -f build_font.py ]; then
            FOUND_SCRIPT=$(find . -name "build_font.py" | head -n 1)
            if [ -n "$FOUND_SCRIPT" ]; then cp "$FOUND_SCRIPT" ./build_font.py; fi
          fi
          python build_font.py
          test -s assets/fonts/AppleLiquidGlassClock.ttf

      - name: Install Android Build-Tools & Package Signed APK
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "build-tools;34.0.0" "platforms;android-34"

          BUILD_TOOLS="$ANDROID_SDK_ROOT/build-tools/34.0.0"
          PLATFORM="$ANDROID_SDK_ROOT/platforms/android-34/android.jar"

          "$BUILD_TOOLS/aapt" package -f -m \
            -M AndroidManifest.xml \
            -S res \
            -A assets \
            -I "$PLATFORM" \
            -F raw.apk

          "$BUILD_TOOLS/zipalign" -f -v 4 raw.apk aligned.apk

          keytool -genkeypair -v \
            -keystore release.keystore \
            -storepass android \
            -alias appleliquidglass \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Monotype, OU=FlipFont, O=Monotype Imaging, L=Woburn, ST=MA, C=US"

          "$BUILD_TOOLS/apksigner" sign \
            --ks release.keystore \
            --ks-key-alias appleliquidglass \
            --ks-pass pass:android \
            --key-pass pass:android \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            --out dist/AppleLiquidGlassClock.apk \
            aligned.apk

          "$BUILD_TOOLS/apksigner" verify --verbose dist/AppleLiquidGlassClock.apk
          cp assets/fonts/AppleLiquidGlassClock.ttf dist/AppleLiquidGlassClock.ttf

      - name: Upload APK and TTF Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AppleLiquidGlassClock-Release
          path: |
            dist/AppleLiquidGlassClock.apk
            dist/AppleLiquidGlassClock.ttf
