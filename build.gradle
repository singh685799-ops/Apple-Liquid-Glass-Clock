// Standalone FlipFont packaging configuration (compiled via Android SDK build-tools in CI)
apply plugin: 'com.android.application'

android {
    namespace "com.monotype.android.font.appleliquidglass"
    compileSdkVersion 34

    defaultConfig {
        applicationId "com.monotype.android.font.appleliquidglass"
        minSdkVersion 24
        targetSdkVersion 33
        versionCode 1
        versionName "1.0"
    }

    sourceSets {
        main {
            manifest.srcFile 'AndroidManifest.xml'
            res.srcDirs = ['res']
            assets.srcDirs = ['assets']
        }
    }
}
